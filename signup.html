<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <title>Signup page</title>
    
</head>
<body>
   <div class="signup">
    <div class="overlay"></div>
     <div class="container" id="signup">
        <h2 class="form-title"> REGISTER</h2>
       <form  method="post">
        <div class="input-group">
            <i class="fas fa-user">&nbsp</i>
            <input type="text" name="fName" id="fName" placeholder="First Name" required>
            <label for="fName ">First Name</label>
        </div>
        <div class="input-group">
            <i class="fas fa-user">&nbsp</i>
            <input type="text" name="lName" id="lName" placeholder="Last Name" required>
            <label for="lName ">Last Name</label>
        </div>
        <div class="input-group">
           <i class="fas fa-id-card">&nbsp</i>
            <input type="number" id="idNumber" name="idNumber" placeholder="Enter your ID number" required>
            <label for="idNumber">ID Number</label>

        </div>
        <div class="input-group">
            <i class="fas fa-envelope">&nbsp</i>
            <input type="email" name="email" id="email" placeholder="Email" required>
            <label for="email ">Email</label>
        </div>
        <div class="input-group">
            <i class="fas fa-lock">&nbsp</i>
             <input type="password" id="password" placeholder="Password" required>
            <label for="password ">Password</label>
        </div>
        <a class="btn" href="dashboard.html">Sign up</a>
        <br>
            <p>Already have Account ?
            <a class="login" href="index.html"> Login</a></p>
        </div>
       </form>
    </div>
   </div>
</body>
</html>
